services:
  app:
    build: .
    image: fpm:local
    env_file:
      - .env
    ports:
      # localhost only; use an HTTPS reverse proxy when publishing the app.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - data:/data
      - type: bind
        source: ./secrets/google-credentials.json
        target: /var/run/secrets/google/credentials.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  data:
