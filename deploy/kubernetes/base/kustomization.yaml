apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: fpm-config
    envs:
      - config.env
  - name: fpm-google-wif
    files:
      - credentials.json=google-wif.json
# Secrets are provisioned separately; examples/secret.yaml.example has empty values.
# Choose overlays/sqlite or overlays/postgres to configure persistent storage.
