apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpm
spec:
  # 同期の排他制御はプロセス内だけ。複数 Pod が同期すると、後から完了した
  # 古い取得結果でデータを上書きし得る。PostgreSQL でも 1 レプリカを維持する。
  replicas: 1
  # 更新時も新旧 Pod の同期を重ねないため、旧 Pod の終了を待ってから起動する。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fpm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fpm
    spec:
      serviceAccountName: fpm
      automountServiceAccountToken: false
      # SIGTERM 後に HTTP リクエストと実行中の同期が終わるのを待つ。
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: fpm:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: fpm-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: fpm-secrets
                  key: SESSION_SECRET
            - name: SOLIDTIME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fpm-secrets
                  key: SOLIDTIME_API_TOKEN
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # Mount whole directories so kubelet's token rotation remains visible.
            - name: oidc-token
              mountPath: /var/run/secrets/oidc
              readOnly: true
            - name: google-token
              mountPath: /var/run/secrets/google-token
              readOnly: true
            - name: google-credentials
              mountPath: /var/run/secrets/google
              readOnly: true
      volumes:
        # base は DB 未設定。SQLite overlay がこの emptyDir を PVC に置き換える。
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: oidc-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  # IdP が受け付ける audience に patch する。Google 用とは別の値。
                  audience: https://idp.example.com/fpm-client-assertion
                  expirationSeconds: 3600
                  path: token
        - name: google-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  # Google WIF provider の許可 audience と一致させる。
                  audience: https://iam.googleapis.com/projects/123456789012/locations/global/workloadIdentityPools/example-pool/providers/example-provider
                  expirationSeconds: 3600
                  path: token
        - name: google-credentials
          configMap:
            name: fpm-google-wif
            defaultMode: 0440
